<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mental Health Smart Check - รพ.ดอนจาน</title>

    <!-- =====================================================
         PWA & APP ICON
    ====================================================== -->

    <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#6c5ce7">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Mental Health Smart Check">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mental Health">

    <link rel="apple-touch-icon" href="./1920.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./512.png">

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --primary: #6c5ce7;
        --secondary: #a29bfe;
        --success: #00b894;
        --warning: #fdcb6e;
        --orange: #e17055;
        --danger: #d63031;
        --bg: #f0f3f7;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Sarabun',
        'TH Sarabun New',
        'TH Sarabun PS',
        'Cordia New',
        'Angsana New',
        sans-serif;

        background-color: var(--bg);
        color: #2d3436;
        margin: 0;
        padding: 15px;
        overflow-x: hidden;
    }

    .container {
        max-width: 700px;
        margin: auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 30px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        position: relative;
    }

    .header {
        text-align: center;
        margin-bottom: 25px;
    }

    .hospital-logo {
        font-size: 60px;
        color: var(--primary);
    }

    /* =====================================================
       PWA INSTALL BUTTON
    ====================================================== */

    #install-app-box {
        display: none;
        margin-bottom: 22px;
        padding: 14px;
        background: linear-gradient(135deg, #f1edff, #ffffff);
        border: 1px solid #ddd6ff;
        border-radius: 20px;
    }

    #install-app-btn {
        background: linear-gradient(135deg, #6c5ce7, #8e7cf5);
        color: white;
        box-shadow: 0 8px 20px rgba(108,92,231,0.25);
    }

    #install-app-btn:hover {
        transform: translateY(-1px);
    }

    .install-logo {
        width: 42px;
        height: 42px;
        object-fit: contain;
        border-radius: 10px;
        background: white;
    }

    .info-section {
        background: linear-gradient(135deg, #f1f4ff, #e8edff);
        padding: 20px;
        border-radius: 20px;
        margin-bottom: 25px;
        border: 2px dashed var(--secondary);
    }

    label {
        font-weight: 700;
        color: var(--primary);
        display: block;
        margin-bottom: 8px;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 2px solid #dfe6e9;
        border-radius: 15px;
        font-family: inherit;
        font-size: 16px;
    }

    .form-section {
        display: none;
    }

    .active {
        display: block;
        animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateX(30px);
        }

        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .question-card {
        background: #fff;
        border: 1px solid #f1f2f6;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.02);
    }

    .question-card p {
        font-weight: 600;
        font-size: 1.1rem;
        color: #4834d4;
        margin-top: 0;
    }

    .options {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 15px;
    }

    .option-item input {
        display: none;
    }

    .option-item label {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;

        padding: 12px;
        text-align: center;
        background: #f8f9fa;
        border: 2px solid #eee;
        border-radius: 15px;
        cursor: pointer;
        transition: 0.2s;
        font-weight: 600;
    }

    .opt-green input:checked + label {
        background: var(--success) !important;
        color: white;
        border-color: var(--success);
    }

    .opt-yellow input:checked + label {
        background: var(--warning) !important;
        color: white;
        border-color: var(--warning);
    }

    .opt-orange input:checked + label {
        background: var(--orange) !important;
        color: white;
        border-color: var(--orange);
    }

    .opt-red input:checked + label {
        background: var(--danger) !important;
        color: white;
        border-color: var(--danger);
    }

    .result-box {
        display: none;
        text-align: center;
        animation: zoomIn 0.5s;
    }

    @keyframes zoomIn {
        from {
            opacity: 0;
            transform: scale(0.9);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        border-radius: 15px;
        overflow: hidden;
    }

    th {
        background: var(--primary);
        color: white;
        padding: 15px;
        text-align: left;
    }

    td {
        padding: 15px;
        border-bottom: 1px solid #f1f1f1;
        text-align: left;
        background: #fff;
    }

    .btn-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 25px;
    }

    button {
        width: 100%;
        padding: 18px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
        font-weight: 700;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 17px;
        transition: 0.2s;
    }

    button:active {
        transform: scale(0.98);
    }

    .btn-next {
        background: var(--primary);
        color: white;
        box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
    }

    .btn-pdf {
        background: #2d3436;
        color: white;
    }

    #print-area {
        display: none;
    }

    @media print {
        html,
        body {
            background: #ffffff !important;
            padding: 0 !important;
            margin: 0 !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .container,
        #setup-ui,
        .btn-group,
        .header {
            display: none !important;
        }

        #print-area {
            display: block !important;
            width: 170mm;
            max-width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            page-break-inside: avoid;
        }

        @page {
            size: A4;
            margin: 15mm 10mm;
        }
    }

    @media (max-width: 480px) {

        body {
            padding: 8px;
        }

        .container {
            padding: 18px;
            border-radius: 22px;
        }

        .hospital-logo {
            font-size: 50px;
        }

        .question-card {
            padding: 15px;
        }

        .options {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
</head>

<body>

<div class="container">

    <div id="setup-ui">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <div class="header">

            <i class="fas fa-heartbeat hospital-logo"></i>

            <h1 style="color:var(--primary); margin:10px 0; font-size:24px;">
                Mental Health Smart Check
            </h1>

            <p style="color:#636e72;">
                โรงพยาบาลดอนจาน จ.กาฬสินธุ์
            </p>

        </div>


        <!-- =====================================================
             INSTALL APP
        ====================================================== -->

        <div id="install-app-box">

            <button id="install-app-btn">

                <img
                    src="./512.png"
                    class="install-logo"
                    alt="Mental Health Smart Check">

                <span>
                    <strong>ติดตั้ง Mental Health Smart Check</strong>
                </span>

                <i class="fas fa-download"></i>

            </button>

            <p style="
                text-align:center;
                color:#636e72;
                font-size:13px;
                margin:10px 5px 0;
            ">
                ติดตั้งเป็นแอปบนมือถือ
                เพื่อเปิดใช้งานได้สะดวกจากหน้าจอหลัก
            </p>

        </div>


        <!-- =====================================================
             USER INFORMATION
        ====================================================== -->

        <div class="info-section">

            <label>
                <i class="fas fa-user-edit"></i>
                ชื่อ-นามสกุล ผู้รับบริการ
            </label>

            <input
                type="text"
                id="client-name"
                placeholder="ระบุชื่อเพื่อบันทึกในรายงาน..."
            >

        </div>


        <!-- =====================================================
             2Q
        ====================================================== -->

        <div id="section-2q" class="form-section active">

            <h2 style="
                color:var(--primary);
                border-left:5px solid var(--primary);
                padding-left:10px;
            ">
                ระดับ 1: คัดกรอง 2Q
            </h2>

            <div id="q2-content"></div>

            <button
                class="btn-next"
                onclick="nextFrom2Q()">

                ไปต่อเพื่อประเมินผล

                <i class="fas fa-chevron-right"></i>

            </button>

        </div>


        <!-- =====================================================
             9Q
        ====================================================== -->

        <div id="section-9q" class="form-section">

            <h2 style="
                color:var(--primary);
                border-left:5px solid var(--primary);
                padding-left:10px;
            ">
                ระดับ 2: ประเมินโรคซึมเศร้า 9Q
            </h2>

            <div id="q9-content"></div>

            <button
                class="btn-next"
                onclick="nextFrom9Q()">

                วิเคราะห์ผล

                <i class="fas fa-magic"></i>

            </button>

        </div>


        <!-- =====================================================
             ST-5
        ====================================================== -->

        <div id="section-st5" class="form-section">

            <h2 style="
                color:var(--primary);
                border-left:5px solid var(--primary);
                padding-left:10px;
            ">
                ระดับ 3: ความเครียด ST-5
            </h2>

            <div id="st5-content"></div>

            <button
                class="btn-next"
                onclick="finishST5()">

                ดูผลลัพธ์สุดท้าย

                <i class="fas fa-chart-pie"></i>

            </button>

        </div>


        <!-- =====================================================
             8Q
        ====================================================== -->

        <div id="section-8q" class="form-section">

            <h2 style="
                color:var(--danger);
                border-left:5px solid var(--danger);
                padding-left:10px;
            ">
                ระดับพิเศษ: ความปลอดภัย 8Q
            </h2>

            <div id="q8-content"></div>

            <button
                class="btn-next"
                onclick="finish8Q()">

                ดูผลลัพธ์สุดท้าย

                <i class="fas fa-shield-alt"></i>

            </button>

        </div>

    </div>


    <!-- =====================================================
         RESULT
    ====================================================== -->

    <div id="section-result" class="result-box">

        <i
            class="fas fa-poll-h"
            style="
                font-size:60px;
                color:var(--primary);
                margin-bottom:15px;
            ">
        </i>

        <h2 style="margin:0;">
            สรุปผลการประเมิน
        </h2>

        <div id="report-details"></div>

        <div style="
            margin-top:20px;
            padding:20px;
            background:#fff4f4;
            border-radius:20px;
            border-left:8px solid var(--danger);
            text-align:left;
        ">

            <b style="
                color:var(--danger);
                font-size:1.1rem;
            ">
                <i class="fas fa-lightbulb"></i>
                คำแนะนำผู้เชี่ยวชาญ:
            </b>

            <p
                id="display-advice"
                style="
                    margin:8px 0 0 0;
                    line-height:1.6;
                ">
            </p>

        </div>

        <div class="btn-group">

            <button
                class="btn-pdf"
                onclick="generateMentalHealthPDF()">

                <i class="fas fa-file-pdf"></i>

                บันทึก PDF (รองรับมือถือ)

            </button>

            <button
                style="background:#dfe6e9; color:#2d3436;"
                onclick="location.reload()">

                เริ่มประเมินใหม่

            </button>

        </div>

    </div>

</div>


<div id="print-area"></div>


<script>

/* =====================================================
   QUESTIONS
===================================================== */

const q9Texts = [
    "เบื่อ ไม่สนใจทำอะไร",
    "ไม่สบายใจ ซึมเศร้า",
    "หลับยาก หรือ หลับมากไป",
    "เหนื่อยง่าย ไม่มีแรง",
    "เบื่ออาหาร หรือ กินมากเกินไป",
    "รู้สึกไม่ดีกับตัวเอง",
    "สมาธิไม่ดีตอนทำอะไร",
    "พูดช้าทำอะไรช้า หรือ กระสับกระส่าย",
    "คิดทำร้ายตนเอง"
];

const st5Texts = [
    "นอนไม่หลับ กระสับกระส่าย",
    "สมาธิน้อยลง",
    "หงุดหงิด/รำคาญใจ",
    "รู้สึกเบื่อ เซ็ง",
    "ไม่อยากพบปะผู้คน"
];

const q8Texts = [
    {t:"คิดอยากตาย/ตายไปจะดีกว่า", v:1},
    {t:"อยากทำร้ายตัวเอง", v:2},
    {t:"คิดเกี่ยวกับการฆ่าตัวตาย", v:6},
    {t:"คุมความอยากฆ่าตัวตายไม่ได้", v:8},
    {t:"มีแผนฆ่าตัวตายจริง", v:8},
    {t:"ทำให้ตนเองบาดเจ็บ(ไม่หวังตาย)", v:4},
    {t:"พยายามฆ่าตัวตาย(หวังให้ตาย)", v:10},
    {t:"เคยพยายามฆ่าตัวตายในอดีต", v:4}
];


let scores = {
    q2: 0,
    q9: -1,
    st5: -1,
    q8: -1
};


/* =====================================================
   LOAD QUESTIONS
===================================================== */

window.onload = () => {

    document.getElementById('q2-content').innerHTML =
        [1,2].map(i => `

            <div class="question-card">

                <p>
                    ${i}.
                    ${
                        i == 1
                        ? 'ช่วง 2 สัปดาห์นี้ หดหู่ เศร้า ท้อแท้?'
                        : 'ช่วง 2 สัปดาห์นี้ เบื่อ ทำอะไรไม่เพลิดเพลิน?'
                    }
                </p>

                <div class="options">

                    <div class="option-item opt-green">

                        <input
                            type="radio"
                            name="2q${i}"
                            id="2q${i}n"
                            value="0">

                        <label for="2q${i}n">
                            ไม่มี
                        </label>

                    </div>

                    <div class="option-item opt-red">

                        <input
                            type="radio"
                            name="2q${i}"
                            id="2q${i}y"
                            value="1">

                        <label for="2q${i}y">
                            มี
                        </label>

                    </div>

                </div>

            </div>

        `).join('');


    document.getElementById('q9-content').innerHTML =
        q9Texts.map((t, i) => `

            <div class="question-card">

                <p>
                    ${i+1}. ${t}
                </p>

                <div class="options">

                    <div class="option-item opt-green">

                        <input
                            type="radio"
                            name="q9_${i}"
                            id="q9_${i}_0"
                            value="0">

                        <label for="q9_${i}_0">
                            ไม่เลย
                        </label>

                    </div>

                    <div class="option-item opt-yellow">

                        <input
                            type="radio"
                            name="q9_${i}"
                            id="q9_${i}_1"
                            value="1">

                        <label for="q9_${i}_1">
                            บางวัน
                        </label>

                    </div>

                    <div class="option-item opt-orange">

                        <input
                            type="radio"
                            name="q9_${i}"
                            id="q9_${i}_2"
                            value="2">

                        <label for="q9_${i}_2">
                            บ่อย
                        </label>

                    </div>

                    <div class="option-item opt-red">

                        <input
                            type="radio"
                            name="q9_${i}"
                            id="q9_${i}_3"
                            value="3">

                        <label for="q9_${i}_3">
                            ทุกวัน
                        </label>

                    </div>

                </div>

            </div>

        `).join('');


    document.getElementById('st5-content').innerHTML =
        st5Texts.map((t, i) => `

            <div class="question-card">

                <p>
                    ${i+1}. ${t}
                </p>

                <div class="options">

                    <div class="option-item opt-green">

                        <input
                            type="radio"
                            name="st5_${i}"
                            id="st5_${i}_0"
                            value="0">

                        <label for="st5_${i}_0">
                            แทบไม่มี
                        </label>

                    </div>

                    <div class="option-item opt-yellow">

                        <input
                            type="radio"
                            name="st5_${i}"
                            id="st5_${i}_1"
                            value="1">

                        <label for="st5_${i}_1">
                            บางครั้ง
                        </label>

                    </div>

                    <div class="option-item opt-orange">

                        <input
                            type="radio"
                            name="st5_${i}"
                            id="st5_${i}_2"
                            value="2">

                        <label for="st5_${i}_2">
                            บ่อยครั้ง
                        </label>

                    </div>

                    <div class="option-item opt-red">

                        <input
                            type="radio"
                            name="st5_${i}"
                            id="st5_${i}_3"
                            value="3">

                        <label for="st5_${i}_3">
                            ประจำ
                        </label>

                    </div>

                </div>

            </div>

        `).join('');


    document.getElementById('q8-content').innerHTML =
        q8Texts.map((d, i) => `

            <div class="question-card">

                <p>
                    ${i+1}. ${d.t}
                </p>

                <div class="options">

                    <div class="option-item opt-green">

                        <input
                            type="radio"
                            name="q8_${i}"
                            id="q8_${i}n"
                            value="0">

                        <label for="q8_${i}n">
                            ไม่มี
                        </label>

                    </div>

                    <div class="option-item opt-red">

                        <input
                            type="radio"
                            name="q8_${i}"
                            id="q8_${i}y"
                            value="${d.v}">

                        <label for="q8_${i}y">
                            มี
                        </label>

                    </div>

                </div>

            </div>

        `).join('');

};


/* =====================================================
   SHOW SECTION
===================================================== */

function show(id) {

    document
        .querySelectorAll('.form-section')
        .forEach(s => s.classList.remove('active'));

    document
        .getElementById(id)
        .classList.add('active');

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}


/* =====================================================
   2Q
===================================================== */

function nextFrom2Q() {

    const r1 =
        document.querySelector('input[name="2q1"]:checked');

    const r2 =
        document.querySelector('input[name="2q2"]:checked');

    if (!r1 || !r2) {

        return alert(
            "กรุณาเลือกคำตอบให้ครบถ้วนครับ"
        );

    }

    scores.q2 =
        parseInt(r1.value) +
        parseInt(r2.value);

    if (scores.q2 > 0) {

        show('section-9q');

    } else {

        finishReport(
            "ผลการคัดกรองปกติ สุขภาพจิตอยู่ในเกณฑ์ดีครับ แนะนำให้รักษาสุขภาพด้วยการพักผ่อนให้เพียงพอ หลีกเลี่ยงภาระงานที่หนักเกินไป และหาเวลาทำกิจกรรมนันทนาการร่วมกับครอบครัวสม่ำเสมอนะครับ"
        );

    }

}


/* =====================================================
   9Q
===================================================== */

function nextFrom9Q() {

    scores.q9 = 0;

    for(let i = 0; i < 9; i++) {

        const r =
            document.querySelector(
                `input[name="q9_${i}"]:checked`
            );

        if(!r) {

            return alert(
                "กรุณาตอบคำถามให้ครบทุกข้อครับ"
            );

        }

        scores.q9 += parseInt(r.value);

    }

    if(scores.q9 >= 7) {

        show('section-8q');

    } else {

        show('section-st5');

    }

}


/* =====================================================
   ST5
===================================================== */

function finishST5() {

    scores.st5 = 0;

    for(let i = 0; i < 5; i++) {

        const r =
            document.querySelector(
                `input[name="st5_${i}"]:checked`
            );

        if(!r) {

            return alert(
                "กรุณาตอบคำถามให้ครบทุกข้อครับ"
            );

        }

        scores.st5 += parseInt(r.value);

    }

    finishReport();

}


/* =====================================================
   8Q
===================================================== */

function finish8Q() {

    scores.q8 = 0;

    for(let i = 0; i < 8; i++) {

        const r =
            document.querySelector(
                `input[name="q8_${i}"]:checked`
            );

        if(!r) {

            return alert(
                "กรุณาตอบคำถามให้ครบทุกข้อครับ"
            );

        }

        scores.q8 += parseInt(r.value);

    }

    finishReport();

}


/* =====================================================
   STATUS COLOR
===================================================== */

function getStatusColor(label) {

    if(label.includes('ปกติ'))
        return '#00b894';

    if(label.includes('น้อย'))
        return '#fdcb6e';

    if(
        label.includes('ปานกลาง') ||
        label.includes('เสี่ยง')
    )
        return '#e17055';

    if(
        label.includes('รุนแรง') ||
        label.includes('มาก')
    )
        return '#d63031';

    return '#2d3436';
}


/* =====================================================
   REPORT
===================================================== */

function finishReport(manualMsg = null) {

    const name =
        document.getElementById('client-name').value ||
        "ผู้รับบริการ";

    let tableHtml = `

        <table border="1"
            style="
                width:100%;
                border-collapse:collapse;
                margin:15px 0;
            ">

            <tr>

                <th style="

                    background:#6c5ce7;
                    color:white;

                </th>

                <th align="center"
                    style="
                        padding:10px;
                        background:#6c5ce7;
                        color:white;
                    ">
                    คะแนน
                </th>

                <th style="
                    padding:10px;
                    background:#6c5ce7;
                    color:white;
                ">
                    แปลผล
                </th>

            </tr>
    `;


    let res2Q =
        scores.q2 > 0
        ? '🚩 มีแนวโน้ม'
        : '✅ ปกติ';


    tableHtml += `

        <tr>

            <td style="padding:10px;">
                1. การคัดกรองเบื้องต้น (2Q)
            </td>

            <td align="center">
                ${scores.q2}

                padding:10px;
                font-weight:700;
                color:${getStatusColor(res2Q)}
            ">
                ${res2Q}
            </td>

        </tr>
    `;


    let advice = manualMsg || "";


    if(scores.q9 !== -1) {

        let lv9 =
            scores.q9 < 7
            ? "ปกติ"
            : scores.q9 <= 12
                ? "มีอาการซึมเศร้าระดับน้อย"
                : scores.q9 <= 18
                    ? "มีอาการซึมเศร้าระดับปานกลาง"
                    : "มีอาการซึมเศร้าระดับรุนแรง";


        tableHtml += `

            <tr>

                <td style="padding:10px;">
                    2. ระดับภาวะซึมเศร้า (9Q)
                </td>

                <td align="center">
                    ${scores.q9}
                </td>

                <td style="
                    padding:10px;
                    font-weight:700;
                    color:${getStatusColor(lv9)}
                ">
                    ${lv9}
                </td>

            </tr>
        `;


        if(!advice) {

            if(scores.q9 >= 13) {

                advice =
                    "พบภาวะซึมเศร้าระดับปานกลางถึงรุนแรง อาจเกิดจากความเหนื่อยล้าสะสมหรือภาวะเครียดในชีวิตประจำวัน แนะนำให้ปรึกษาบุคลากรทางการแพทย์หรือเข้าพบเจ้าหน้าที่สาธารณสุข ณ โรงพยาบาลใกล้บ้าน เพื่อรับการดูแลและคำแนะนำที่เหมาะสมอย่างทันท่วงทีครับ";

            } else {

                advice =
                    "ช่วงนี้อาจมีความเครียดหรือความกังวลใจจากการทำงานหรือการดำเนินชีวิตประจำวัน แนะนำให้ผ่อนคลายความเหนื่อยล้า พูดคุยระบายความรู้สึกกับบุคคลที่ไว้วางใจ และสังเกตอาการตนเองเป็นระยะครับ";

            }

        }

    }


    if(scores.st5 !== -1) {

        let lvST =
            scores.st5 <= 4
            ? "ปกติ"
            : scores.st5 <= 7
                ? "ความเครียดระดับน้อย"
                : scores.st5 <= 9
                    ? "ความเครียดระดับปานกลาง"
                    : "ความเครียดระดับมาก";


        tableHtml += `

            <tr>

                <td style="padding:10px;">
                    3. ระดับความเครียด (ST-5)
                </td>

                <td align="center">
                    ${scores.st5}
                </td>

                <td style="
                    padding:10px;
                    font-weight:700;
                    color:${getStatusColor(lvST)}
                ">
                    ${lvST}
                </td>

            </tr>
        `;


        if(!advice) {

            if(scores.st5 >= 8) {

                advice =
                    "ระดับความเครียดค่อนข้างสูง ซึ่งอาจส่งผลกระทบต่อการนอนหลับ สมาธิ และสุขภาพกายในระยะยาว ควรจัดสรรเวลาพักผ่อน ฝึกการผ่อนคลายกล้ามเนื้อ หรือปรึกษาเจ้าหน้าที่สาธารณสุขครับ";

            } else {

                advice =
                    "ระดับความเครียดอยู่ในเกณฑ์ที่สามารถบริหารจัดการได้ตามปกติ แนะนำให้ทำกิจกรรมผ่อนคลายที่ชื่นชอบ ออกกำลังกายเบาๆ และหลีกเลี่ยงปัจจัยกระตุ้นความกังวลครับ";

            }

        }

    }


    if(scores.q8 !== -1) {

        let lv8 =
            scores.q8 === 0
            ? "ปกติ"
            : scores.q8 <= 8
                ? "ความเสี่ยงระดับน้อย"
                : scores.q8 <= 16
                    ? "ความเสี่ยงระดับปานกลาง"
                    : "ความเสี่ยงระดับรุนแรง";


        tableHtml += `

            <tr>

                <td style="padding:10px;">
                    4. แนวโน้มความรุนแรง (8Q)
                </td>

                <td align="center">
                    ${scores.q8}
                </td>

                <td style="
                    padding:10px;
                    font-weight:700;
                    color:${getStatusColor(lv8)}
                ">
                    ${lv8}
                </td>

            </tr>
        `;


        if(scores.q8 >= 1) {

            advice =
                "พบสัญญาณความเสี่ยงที่ต้องเฝ้าระวังอย่างใกล้ชิด เพื่อความปลอดภัยและการดูแลสุขภาพจิตที่ถูกต้อง แนะนำให้ติดต่อสายด่วนสุขภาพจิต โทร. 1323 หรือเข้ารับคำปรึกษาจากทีมแพทย์และพยาบาลที่โรงพยาบาลใกล้บ้านโดยเร็วครับ";

        }

    }


    tableHtml += `</table>`;


    document.getElementById(
        'report-details'
    ).innerHTML = tableHtml;


    document.getElementById(
        'display-advice'
    ).innerText = advice;


    document.getElementById(
        'setup-ui'
    ).style.display = 'none';


    document.getElementById(
        'section-result'
    ).style.display = 'block';

}

/* =====================================================
   PWA INSTALL
===================================================== */

let deferredPrompt = null;

const installBox =
    document.getElementById(
        'install-app-box'
    );

const installBtn =
    document.getElementById(
        'install-app-btn'
    );


function isAppInstalled() {

    return (
        window.matchMedia(
            '(display-mode: standalone)'
        ).matches
        ||
        window.navigator.standalone === true
    );

}


/* =====================================================
   BEFORE INSTALL PROMPT
===================================================== */

window.addEventListener(
    'beforeinstallprompt',
    (e) => {

        e.preventDefault();

        deferredPrompt = e;

        if(!isAppInstalled()) {

            installBox.style.display =
                'block';

        }

    }
);


/* =====================================================
   INSTALL BUTTON
===================================================== */

installBtn.addEventListener(
    'click',
    async () => {

        if(!deferredPrompt) {

            alert(
                "หากไม่พบหน้าต่างติดตั้ง กรุณากดเมนู ⋮ ของ Chrome แล้วเลือก\n\nเพิ่มลงในหน้าจอหลัก หรือ ติดตั้งแอป"
            );

            return;

        }


        deferredPrompt.prompt();


        const { outcome } =
            await deferredPrompt.userChoice;


        console.log(
            'Install outcome:',
            outcome
        );


        deferredPrompt = null;

        installBox.style.display =
            'none';

    }
);


/* =====================================================
   APP INSTALLED
===================================================== */

window.addEventListener(
    'appinstalled',
    () => {

        console.log(
            'Mental Health Smart Check installed'
        );

        installBox.style.display =
            'none';

        deferredPrompt = null;

    }
);


/* =====================================================
   IF ALREADY INSTALLED
===================================================== */

if(isAppInstalled()) {

    installBox.style.display =
        'none';

}


/* =====================================================
   SERVICE WORKER
===================================================== */

if('serviceWorker' in navigator) {

    window.addEventListener(
        'load',
        () => {

            navigator.serviceWorker
                .register('./sw.js')

                .then(
                    registration => {

                        console.log(
                            'Service Worker registered:',
                            registration.scope
                        );

                    }
                )

                .catch(
                    error => {

                        console.error(
                            'Service Worker registration failed:',
                            error
                        );

                    }
                );

        }
    );

}

</script>
